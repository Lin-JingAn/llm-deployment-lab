<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>模型调用记录 | LLM Deployment Lab</title>
  <meta
    name="description"
    content="查看当前账户的大模型调用次数、Token 用量、响应延迟和调用状态。"
  >
  <link rel="stylesheet" href="styles.css?v=20260802221714">
  <link rel="stylesheet" href="usage.css?v=20260802221714">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="site-logo" href="index.html">
        LLM Deployment Lab
      </a>

      <nav class="site-nav">
        <a href="index.html#model-chat">在线对话</a>
        <a href="usage.html" aria-current="page">调用记录</a>
      </nav>

      <div class="usage-user-actions">
        <span id="usage-user-name">正在读取账户</span>
        <button
          id="usage-logout-button"
          class="header-logout-button"
          type="button"
        >
          退出
        </button>
      </div>
    </div>
  </header>

  <main class="usage-page">
    <section class="container usage-hero">
      <div>
        <p class="section-label">MODEL USAGE DASHBOARD</p>
        <h1>模型调用记录</h1>
        <p class="usage-description">
          统计当前账户的模型调用状态、Token 用量和响应延迟。
          这里只显示当前登录用户自己的记录。
        </p>
      </div>

      <button
        id="usage-refresh-button"
        class="primary-button"
        type="button"
      >
        刷新数据
      </button>
    </section>

    <section class="container usage-summary-grid">
      <article class="usage-summary-card">
        <span>总调用次数</span>
        <strong id="summary-total-calls">—</strong>
      </article>

      <article class="usage-summary-card">
        <span>成功调用</span>
        <strong id="summary-success-calls">—</strong>
      </article>

      <article class="usage-summary-card">
        <span>失败调用</span>
        <strong id="summary-failed-calls">—</strong>
      </article>

      <article class="usage-summary-card">
        <span>总 Token</span>
        <strong id="summary-total-tokens">—</strong>
      </article>

      <article class="usage-summary-card">
        <span>输入 / 输出 Token</span>
        <strong id="summary-token-split">—</strong>
      </article>

      <article class="usage-summary-card">
        <span>平均响应时间</span>
        <strong id="summary-average-latency">—</strong>
      </article>
    </section>

    <section class="container usage-panel">
      <div class="usage-toolbar">
        <label>
          <span>调用状态</span>
          <select id="usage-status-filter">
            <option value="">全部状态</option>
            <option value="success">成功</option>
            <option value="failed">失败</option>
          </select>
        </label>

        <label>
          <span>模型</span>
          <select id="usage-model-filter">
            <option value="">全部模型</option>
          </select>
        </label>

        <div class="usage-toolbar-meta">
          <span id="usage-result-count">正在加载</span>
        </div>
      </div>

      <div
        id="usage-error"
        class="usage-error"
        hidden
      ></div>

      <div class="usage-table-wrapper">
        <table class="usage-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>模型与供应商</th>
              <th>状态</th>
              <th>模式</th>
              <th>Token</th>
              <th>延迟</th>
              <th>消息数</th>
              <th>错误</th>
            </tr>
          </thead>
          <tbody id="usage-table-body"></tbody>
        </table>
      </div>

      <p
        id="usage-empty"
        class="usage-empty"
        hidden
      >
        当前筛选条件下没有调用记录。
      </p>

      <div class="usage-pagination">
        <button
          id="usage-previous-button"
          class="secondary-button"
          type="button"
          disabled
        >
          上一页
        </button>

        <span id="usage-page-label">第 1 页</span>

        <button
          id="usage-next-button"
          class="secondary-button"
          type="button"
          disabled
        >
          下一页
        </button>
      </div>
    </section>
  </main>

  <script src="auth.js?v=0.5.0"></script>
  <script src="usage.js?v=20260802221714"></script>
</body>
</html>
