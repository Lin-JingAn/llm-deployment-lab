<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>注册 | Unified LLM Platform</title>

  <link
    rel="stylesheet"
    href="auth.css"
  >
</head>

<body>
  <main class="auth-page">

    <section class="auth-introduction">
      <h1>Unified LLM Platform</h1>

      <p>
        一个统一接入多家大模型、管理调用记录、
        用户账户和平台用量的智能服务平台。
      </p>
    </section>

    <section class="auth-panel">
      <div class="auth-card">

        <a
          class="back-link"
          href="index.html"
        >
          ← 返回首页
        </a>

        <h2>创建账户</h2>

        <p class="auth-description">
          注册后可以使用平台模型服务并查看个人调用记录。
        </p>

        <div
          id="register-message"
          class="auth-message"
          role="alert"
        ></div>

        <form
          id="register-form"
          class="auth-form"
        >
          <div class="form-field">
            <label for="display-name">
              显示名称
            </label>

            <input
              id="display-name"
              name="displayName"
              type="text"
              maxlength="100"
              autocomplete="name"
              placeholder="你的名称"
            >
          </div>

          <div class="form-field">
            <label for="email">
              邮箱
            </label>

            <input
              id="email"
              name="email"
              type="email"
              maxlength="320"
              autocomplete="email"
              required
              placeholder="name@example.com"
            >
          </div>

          <div class="form-field">
            <label for="password">
              密码
            </label>

            <input
              id="password"
              name="password"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
              placeholder="至少8个字符"
            >
          </div>

          <div class="form-field">
            <label for="confirm-password">
              确认密码
            </label>

            <input
              id="confirm-password"
              name="confirmPassword"
              type="password"
              minlength="8"
              maxlength="128"
              autocomplete="new-password"
              required
              placeholder="再次输入密码"
            >
          </div>

          <button
            id="register-button"
            class="auth-button"
            type="submit"
          >
            注册
          </button>
        </form>

        <p class="auth-switch">
          已经有账户？
          <a href="login.html">
            前往登录
          </a>
        </p>
      </div>
    </section>

  </main>

  <script src="auth.js"></script>

  <script>
    "use strict";

    const registerForm =
      document.getElementById("register-form");

    const registerButton =
      document.getElementById("register-button");

    const registerMessage =
      document.getElementById("register-message");


    function showRegisterMessage(
      message,
      type
    ) {
      registerMessage.textContent = message;

      registerMessage.className =
        `auth-message is-visible is-${type}`;
    }


    registerForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const displayName =
          document
            .getElementById("display-name")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirm-password")
            .value;

        if (password !== confirmPassword) {
          showRegisterMessage(
            "两次输入的密码不一致。",
            "error"
          );

          return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "正在注册……";

        try {
          await UnifiedLlmAuth.registerUser({
            email,
            password,
            displayName
          });

          showRegisterMessage(
            "注册成功，正在前往登录页面。",
            "success"
          );

          window.setTimeout(
            () => {
              window.location.href = "login.html";
            },
            800
          );
        }
        catch (error) {
          showRegisterMessage(
            error.message,
            "error"
          );
        }
        finally {
          registerButton.disabled = false;
          registerButton.textContent = "注册";
        }
      }
    );
  </script>
</body>
</html>
