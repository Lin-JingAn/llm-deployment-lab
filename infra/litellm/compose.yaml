services:
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.94.0
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${LITELLM_MASTER_KEY}
      HTTP_PROXY: http://host.docker.internal:8899
      HTTPS_PROXY: http://host.docker.internal:8899
      http_proxy: http://host.docker.internal:8899
      https_proxy: http://host.docker.internal:8899
      NO_PROXY: 127.0.0.1,localhost,db,${LOCAL_VLLM_HOST}
      no_proxy: 127.0.0.1,localhost,db,${LOCAL_VLLM_HOST}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U litellm -d litellm
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  postgres_data:
